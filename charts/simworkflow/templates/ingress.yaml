{{- range $component := list "s3" "registry" }}
{{- $v := index $.Values $component }}
{{- if and $v.enabled $v.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "simworkflow.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "simworkflow.labels" $ | nindent 4 }}
  {{- with $v.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $v.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $v.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "%s.ingress.host is required" $component) $v.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "simworkflow.name" $ }}-{{ $component }}
                port:
                  number: {{ ternary 9000 5000 (eq $component "s3") }}
{{- end }}
{{- end }}
