# Keep connection settings here. Register secrets with credentials set.
# Authentication in keyring mode never falls back to plaintext files.
credentials:
  store: keyring

argoWorkflow:
  server: https://argo.example.com
  namespace: argo-workflows

s3:
  endpoint: https://s3.example.com
  region: us-east-1
  bucket: simworkflows
  forcePathStyle: true

registry:
  url: https://ghcr.io

simScope:
  url: ""

httpTimeout: 30s
