name: Helm Chart
on:
  pull_request:
    paths: ['charts/**', '.github/workflows/helm.yml', 'internal/config/**', 'go.mod', 'go.sum']
  push:
    branches: [main]
    paths: ['charts/**', '.github/workflows/helm.yml', 'internal/config/**', 'go.mod', 'go.sum']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SIMWORKFLOW_HELM_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: helm dependency build charts/simworkflow
      - run: helm lint charts/simworkflow --strict
      - run: go test -v ./charts/simworkflow/tests
      - run: helm package charts/simworkflow --destination dist
