# Apply in the execution namespace. This grants the Argo executor its minimal
# result-reporting permissions and does not grant cluster administration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simworkflow-executor
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simworkflow-executor
  namespace: argo-workflows
subjects:
  - kind: ServiceAccount
    name: simworkflow
    namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simworkflow-executor
