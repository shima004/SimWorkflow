apiVersion: simworkflow/v1alpha1
kind: Experiment

metadata:
  name: module-comparison
  description: 同じマップとシードでモジュールの組み合わせを比較する

spec:
  simulator:
    image: ghcr.io/shima004/rcrs-server:v1.0.4
    resources:
      cpu: 2
      memory: 8Gi

  agents:
    - name: comparison
      image: registry.example.com/rescue-agent:v1
      resources:
        cpu: 4
        memory: 8Gi
      matrix:
        modules:
          SampleRoadDetector.PathPlanning:
            - adf.impl.module.algorithm.DijkstraPathPlanning
            # Placeholder: include your own implementation in the image.
            - my_team.module.algorithm.CustomPathPlanning
          SampleRoadDetector.Clustering:
            - adf.impl.module.algorithm.KMeansClustering
            # Placeholder: include your own implementation in the image.
            - my_team.module.algorithm.CustomClustering
        exclude:
          - modules:
              SampleRoadDetector.PathPlanning: adf.impl.module.algorithm.DijkstraPathPlanning
              SampleRoadDetector.Clustering: my_team.module.algorithm.CustomClustering

  conditions:
    maps:
      - name: map-a
        source: s3://rescue-maps/map-a.zip
    seeds: [1, 2, 3]

  execution:
    maxParallelRuns: 4
    timeout: 30m

  outputs:
    collect:
      - score
      - simulatorLogs
      - agentLogs
