apiVersion: simworkflow/v1alpha1
kind: Experiment

metadata:
  name: python-module-comparison
  description: Python版で経路探索モジュールを比較する

spec:
  simulator:
    image: registry.example.com/rescue-simulator:v1
    resources:
      cpu: 2
      memory: 4Gi

  agents:
    - name: python-comparison
      image: registry.example.com/rescue-agent-python:v1
      resources:
        cpu: 4
        memory: 8Gi
      modules:
        SampleRoadDetector.Clustering: adf_core_python.implement.module.algorithm.k_means_clustering.KMeansClustering
      matrix:
        modules:
          SampleRoadDetector.PathPlanning:
            - adf_core_python.implement.module.algorithm.a_star_path_planning.AStarPathPlanning
            # Placeholder: include your own implementation in the image.
            - src.my_team.custom_path_planning.CustomPathPlanning

  conditions:
    maps:
      - name: map-a
        source: s3://rescue-maps/map-a.zip
    seeds: [1, 2, 3]

  execution:
    maxParallelRuns: 4
    timeout: 30m

  outputs:
    collect: [score, simulatorLogs, agentLogs]
